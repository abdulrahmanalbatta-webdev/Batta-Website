name: deploy (vercel)

# Builds and deploys main to Vercel, to the project the site runs on: repository variable VERCEL_PROJECT, else "abdulrhmanalbatta"
# (the project behind albatta.vercel.app). It must already exist: renaming it in Vercel means updating that name here.
# Stays a no-op until the repository secret VERCEL_TOKEN is set (Vercel → Account Settings → Tokens).
# The dashboard's API comes from the repository variable VITE_API_URL, else the alwaysdata address below;
# the site's own public address (canonical links, sitemap, share tags) from VITE_SITE_URL, else the vercel.app one.
# Every 6 hours too: the build writes each page's text for search engines and AI crawlers (vite/seo.js),
# so courses and articles added in the dashboard reach them without a code change.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://abdulrhman-dashboard.alwaysdata.net/api/v1' }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://albatta.vercel.app' }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'abdulrhmanalbatta' }}

    steps:
      - name: Waiting for VERCEL_TOKEN
        if: env.VERCEL_TOKEN == ''
        run: echo "Add the VERCEL_TOKEN repository secret to deploy to Vercel."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22

      # never creates a project: a missing one (say, renamed in Vercel) fails here and lists the account's projects,
      # instead of deploying somewhere nobody visits
      - name: Link the Vercel project
        if: env.VERCEL_TOKEN != ''
        run: |
          if ! npx --yes vercel@63.1.2 project inspect "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "::error::No Vercel project named \"$VERCEL_PROJECT\". Set the repository variable VERCEL_PROJECT to the site's project name:"
            npx --yes vercel@63.1.2 project ls --token "$VERCEL_TOKEN"
            exit 1
          fi
          npx --yes vercel@63.1.2 link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      # the build settings come from vercel.json
      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@63.1.2 deploy --prod --yes --build-env VITE_API_URL="$VITE_API_URL" --build-env VITE_SITE_URL="$VITE_SITE_URL" --token "$VERCEL_TOKEN"
